server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de una subida (radiografías, S5). Valor provisional: ajustar con la clínica.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # El odontograma se muestra en un iframe del mismo origen.
    add_header X-Frame-Options SAMEORIGIN always;

    # Salud del sistema a través de nginx: /api/health y /api/health/ready.
    location ~ ^/api/(health(/ready)?)$ {
        proxy_pass http://api:8000/$1;
    }

    # API REST: se conserva la ruta completa (/api/v1/...).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La web es una SPA con router en modo hash: todo lo demás es estático.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
